<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School ERP Portal</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="login-selection">
            <div class="header">
                <h1><i class="fas fa-school"></i> School ERP Portal</h1>
                <p>Welcome to Our Educational Management System</p>
            </div>
            
            <div class="login-options">
                <div class="login-card">
                    <div class="card-icon">
                        <i class="fas fa-graduation-cap"></i>
                    </div>
                    <h3>Student Login</h3>
                    <p>Access your academic information, attendance, and more</p>
                    <button onclick="window.location.href='student-login.html'" class="login-btn student-btn">
                        <i class="fas fa-sign-in-alt"></i> Student Portal
                    </button>
                </div>
                
                <div class="login-card">
                    <div class="card-icon">
                        <i class="fas fa-chalkboard-teacher"></i>
                    </div>
                    <h3>Teacher Login</h3>
                    <p>Manage classes, students, and academic activities</p>
                    <button onclick="window.location.href='teacher-login.html'" class="login-btn teacher-btn">
                        <i class="fas fa-sign-in-alt"></i> Teacher Portal
                    </button>
                </div>
            </div>
            
            <div class="footer">
                <p>&copy; 2024 School ERP System. All rights reserved.</p>
            </div>
        </div>
    </div>
</body>
</html>
